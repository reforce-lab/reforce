name: 🐛 Bug 报告
description: 报告一个可复现的缺陷
title: "fix(scope): "
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢报告！请尽量提供最小复现。不确定是 bug 还是设计如此？先用 [RFC] 模板开讨论。
  - type: textarea
    id: current
    attributes:
      label: 实际行为
      description: 发生了什么？附完整错误输出 / 堆栈。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 最小复现
      description: 步骤、代码片段或仓库链接。越小便越容易被修复。
      render: bash
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      description: bun --version / OS / 相关包版本
      placeholder: "bun 1.3.14, macOS 15, @reforce/core 0.0.0"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我搜索过现有 Issues，没有重复报告
          required: true
        - label: 我验证了这不是我本地环境独有的一次性问题
          required: true
