name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: microsoft/apm-action@v1
        if: runner.os != 'Windows'
        with:
          apm-version: "0.26.0"
          setup-only: true

      - name: Install APM on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "apm-windows-x86_64.zip"
          $destination = Join-Path $env:RUNNER_TEMP "apm-0.26.0"
          Invoke-WebRequest -Uri "https://github.com/microsoft/apm/releases/download/v0.26.0/apm-windows-x86_64.zip" -OutFile $archive
          $expectedHash = "1b74a90c7ee6373ab2926addd110c1dbc5934a9675e5f436cac4d04f46cce2f5"
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "APM archive hash mismatch: $actualHash"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $executable = Get-ChildItem -LiteralPath $destination -Filter "apm.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $executable) {
            throw "APM archive did not contain apm.exe"
          }
          Split-Path -Parent $executable | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $executable --version

      - name: Verify exact toolchain versions
        run: bun -e "if (Bun.version !== '1.3.14') process.exit(1)"

      # Windows 上未缓存的 bun install 要 31s，是 ubuntu 的 6 倍（Issue #40）。
      - name: Cache Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Turbo 默认写 <repo-root>/.turbo/cache。key 取 SHA 使每次提交独立成条，
      # restore-keys 让未改动 package 的 build/typecheck/test 命中上一条（Issue #40）。
      - name: Cache Turbo task cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-

      - name: Check source contracts and formatting
        run: bun run check

      - name: Typecheck (TS7)
        run: bun run typecheck

      - name: Test unit, integration, process, lease, and recovery behavior (Bun)
        run: bun run test

      - name: Build
        run: bun run build

      - name: Real CLI, process, Worker, signal, and Bun artifact smoke
        run: bun run --cwd e2e test:e2e:evidence

      - name: Upload CLI process failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cli-process-evidence-${{ runner.os }}
          path: e2e/e2e-junit.xml
          if-no-files-found: warn

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: microsoft/apm-action@v1
        with:
          apm-version: "0.26.0"
          setup-only: true

      - name: Cache Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint PR commits
        run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
