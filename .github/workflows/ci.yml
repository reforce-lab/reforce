name: ci

on:
  push:
    branches: [main]
  pull_request:

# 分支保护是 strict: true，main 每前进一次所有未合分支都要 rebase 重推，旧 run 不取消就会同时
# 挂着好几轮抢 windows 名额。只对 PR 取消：push 到 main 的 run 是该 commit 唯一的验证记录，
# 取消它会让某个 main commit 永久失去证据（Issue #75）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 纯 .md 变更跳过三平台 verify（Issue #43）。verify 是 required check，
  # 不能用 workflow 级 paths-ignore：被过滤掉的 workflow 不上报 check，
  # required 状态会永远 pending 卡住合并；job 级 if 跳过则以 skipped 结论
  # 上报，分支保护视同通过。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7

      # predicate-quantifier: every 使 "**" + "!**/*.md" 表示
      # 「存在至少一个非 Markdown 的变更文件」；push 到 main 时以
      # default branch 为 base 比对（action 默认行为）。
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - "**"
              - "!**/*.md"

  verify:
    needs: changes
    # fail-safe：changes 自身失败时 verify 照常执行，探测故障不得放行（Issue #43）。
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # 正常一轮 3 分钟（ubuntu ~55s / macos ~55s / windows 2m30s–3m10s，check/typecheck 仅 ubuntu
    # 执行后 macos/windows 各省 3–15s，Issue #172）；冷缓存留足余量后仍远小于 GitHub 默认的
    # 6 小时。挂死的测试必须快速失败，而不是把 runner 占一上午（Issue #75）。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: "11.20.0"

      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: pnpm

      - uses: microsoft/apm-action@v1
        if: runner.os != 'Windows'
        with:
          apm-version: "0.27.0"
          setup-only: true

      - name: Install APM on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "apm-windows-x86_64.zip"
          $destination = Join-Path $env:RUNNER_TEMP "apm-0.27.0"
          Invoke-WebRequest -Uri "https://github.com/microsoft/apm/releases/download/v0.27.0/apm-windows-x86_64.zip" -OutFile $archive
          $expectedHash = "1a7703864babee7deaab3d13b4fe50b51ea5c1ae2edb2dae46fbbab5a6cead9d"
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "APM archive hash mismatch: $actualHash"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $executable = Get-ChildItem -LiteralPath $destination -Filter "apm.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $executable) {
            throw "APM archive did not contain apm.exe"
          }
          Split-Path -Parent $executable | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $executable --version

      - name: Verify exact toolchain versions
        run: node -e "if (process.versions.node.split('.')[0] !== '26') process.exit(1)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # CI 不做 turbo 任务缓存（曾按 Issue #40 以 SHA 分条 + restore-keys 复用）：跨 run 恢复
      # 的缓存态让同一失败在不同 run 里表象漂移（#153 排障实录：同一 rspack 竞态在不同缓存
      # 命中组合下呈现 137/134 两种信号），验证一致性优先于增量的分钟级节省；run 内的任务
      # 去重仍由 turbo 进程内完成，不受影响。

      # Biome 与 tsgo 的结果与平台无关，三平台重复执行无信息量；只在 ubuntu 跑，
      # macos/windows 显示 skipped（Issue #172）。不拆独立 job：那要动分支保护的
      # required checks，且新增 job 的 checkout/install 开销把几秒收益吃回去。
      - name: Check source contracts and formatting
        if: runner.os == 'Linux'
        run: pnpm run check

      - name: Typecheck (TS7)
        if: runner.os == 'Linux'
        run: pnpm run typecheck

      - name: Test unit, integration, process, lease, and recovery behavior (Node.js)
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Real CLI, process, Worker, signal, and Node.js artifact smoke
        run: pnpm --dir e2e run test:e2e:evidence

      - name: Upload CLI process failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cli-process-evidence-${{ runner.os }}
          path: e2e/e2e-junit.xml
          if-no-files-found: warn

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: "11.20.0"

      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: pnpm

      - uses: microsoft/apm-action@v1
        with:
          apm-version: "0.27.0"
          setup-only: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint PR commits
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
