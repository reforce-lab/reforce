name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24.12.0"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: microsoft/apm-action@v1
        if: runner.os != 'Windows'
        with:
          apm-version: "0.26.0"
          setup-only: true

      - name: Install APM on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "apm-windows-x86_64.zip"
          $destination = Join-Path $env:RUNNER_TEMP "apm-0.26.0"
          Invoke-WebRequest -Uri "https://github.com/microsoft/apm/releases/download/v0.26.0/apm-windows-x86_64.zip" -OutFile $archive
          $expectedHash = "1b74a90c7ee6373ab2926addd110c1dbc5934a9675e5f436cac4d04f46cce2f5"
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "APM archive hash mismatch: $actualHash"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $executable = Get-ChildItem -LiteralPath $destination -Filter "apm.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $executable) {
            throw "APM archive did not contain apm.exe"
          }
          Split-Path -Parent $executable | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $executable --version

      - name: Verify exact toolchain versions
        run: |
          node -e "if (process.versions.node !== '24.12.0') process.exit(1)"
          bun -e "if (Bun.version !== '1.3.14') process.exit(1)"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check and formatting
        run: |
          bun run check:write
          git diff --exit-code -- . ':(top,exclude).lsp.json'

      - name: Check source contracts
        run: bun run check

      - name: Typecheck (TS7)
        run: bun run typecheck

      - name: Test (Bun)
        run: bun run test

      - name: Lease and transaction crash recovery
        run: bun run --cwd packages/cli test:recovery:evidence

      - name: Build
        run: bun run build

      - name: Real CLI, process, Worker, signal, and Node/Bun artifact smoke
        run: bun run --cwd packages/cli test:e2e:evidence

      - name: Full compiler frontend benchmark
        env:
          REFORCE_BENCHMARK_OUTPUT: benchmark-results/${{ runner.os }}.json
        run: bun run --cwd packages/compiler-babel benchmark

      - name: Upload frontend benchmark samples
        uses: actions/upload-artifact@v7
        with:
          name: frontend-benchmark-${{ runner.os }}
          path: packages/compiler-babel/benchmark-results/${{ runner.os }}.json
          if-no-files-found: error

      - name: Upload CLI process failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cli-process-evidence-${{ runner.os }}
          path: |
            packages/cli/recovery-junit.xml
            packages/cli/e2e-junit.xml
          if-no-files-found: warn

  frontend-selection:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24.12.0"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: microsoft/apm-action@v1
        with:
          apm-version: "0.26.0"
          setup-only: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download frontend benchmark samples
        uses: actions/download-artifact@v8
        with:
          pattern: frontend-benchmark-*
          path: benchmark-results
          merge-multiple: true

      - name: Select the global default frontend
        env:
          REFORCE_FRONTEND_SELECTION_OUTPUT: benchmark-results/selection.json
        run: >-
          node --conditions=development packages/compiler-babel/tooling/select-frontend.ts
          benchmark-results/Linux.json
          benchmark-results/macOS.json
          benchmark-results/Windows.json

      - name: Upload global frontend selection
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-selection
          path: benchmark-results/selection.json
          if-no-files-found: error

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24.12.0"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: microsoft/apm-action@v1
        with:
          apm-version: "0.26.0"
          setup-only: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint PR commits
        run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
