name: ci

on:
  push:
    branches: [main]
  pull_request:

# 只对 PR 取消：连推同一分支时旧 run 已无人看，留着只是抢 windows 名额。
#
# push 到 main 的 run 不取消，两重理由：它是该 commit 唯一的验证记录，取消就让某个 main commit
# 永久失去证据（Issue #75）；而且分支保护是 strict: false（PR 不要求先 rebase 到最新 main），
# 所以两个各自绿的 PR 合进来之后，那个**组合**没被任何 PR run 验证过——只有 main 上这一轮跑的
# 才是它的验证记录。此处曾写「strict: true，main 每前进一次未合分支都要 rebase 重推」，与实际
# 配置相反，照它规划会白做一轮 rebase 与 CI（Issue #305）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 纯 .md 变更跳过三平台 verify（Issue #43）。verify 是 required check，跳过只能落在
  # step 级：workflow 级 paths-ignore 让整个 workflow 不上报 check；job 级 if 为 false
  # 则 matrix 不展开，三个 verify (<os>) 一次都不上报——两者都让 required 永远 pending、
  # 合并永久卡死（Issue #267）。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7

      # predicate-quantifier: every 使 "**" + "!**/*.md" 表示
      # 「存在至少一个非 Markdown 的变更文件」；push 到 main 时以
      # default branch 为 base 比对（action 默认行为）。
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - "**"
              - "!**/*.md"

  verify:
    needs: changes
    # 这里只能挡 cancelled：任何其他条件为 false 都会让 matrix 不展开（Issue #267）。
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # 真正的闸门。fail-safe：changes 自身失败时 verify 照常执行，探测故障不得放行
      # （Issue #43）。纯 .md 时全部 step 跳过，job 仍以 success 上报三个具名 check。
      RUN_VERIFY: ${{ needs.changes.result != 'success' || needs.changes.outputs.code == 'true' }}
    # 正常一轮 3 分钟（ubuntu ~55s / macos ~55s / windows 2m30s–3m10s，check/typecheck 仅 ubuntu
    # 执行后 macos/windows 各省 3–15s，Issue #172）；冷缓存留足余量后仍远小于 GitHub 默认的
    # 6 小时。挂死的测试必须快速失败，而不是把 runner 占一上午（Issue #75）。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        if: env.RUN_VERIFY == 'true'

      - uses: pnpm/action-setup@v6
        if: env.RUN_VERIFY == 'true'
        with:
          version: "11.20.0"

      - uses: actions/setup-node@v6
        if: env.RUN_VERIFY == 'true'
        with:
          node-version: "26"
          cache: pnpm

      - uses: microsoft/apm-action@v1
        if: env.RUN_VERIFY == 'true' && runner.os != 'Windows'
        with:
          apm-version: "0.27.0"
          setup-only: true

      - name: Install APM on Windows
        if: env.RUN_VERIFY == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "apm-windows-x86_64.zip"
          $destination = Join-Path $env:RUNNER_TEMP "apm-0.27.0"
          Invoke-WebRequest -Uri "https://github.com/microsoft/apm/releases/download/v0.27.0/apm-windows-x86_64.zip" -OutFile $archive
          $expectedHash = "1a7703864babee7deaab3d13b4fe50b51ea5c1ae2edb2dae46fbbab5a6cead9d"
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "APM archive hash mismatch: $actualHash"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $executable = Get-ChildItem -LiteralPath $destination -Filter "apm.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $executable) {
            throw "APM archive did not contain apm.exe"
          }
          Split-Path -Parent $executable | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $executable --version

      - name: Verify exact toolchain versions
        if: env.RUN_VERIFY == 'true'
        run: node -e "if (process.versions.node.split('.')[0] !== '26') process.exit(1)"

      - name: Install dependencies
        if: env.RUN_VERIFY == 'true'
        run: pnpm install --frozen-lockfile

      # CI 不做 turbo 任务缓存（曾按 Issue #40 以 SHA 分条 + restore-keys 复用）：跨 run 恢复
      # 的缓存态让同一失败在不同 run 里表象漂移（#153 排障实录：同一 rspack 竞态在不同缓存
      # 命中组合下呈现 137/134 两种信号），验证一致性优先于增量的分钟级节省；run 内的任务
      # 去重仍由 turbo 进程内完成，不受影响。

      # Biome 与 tsgo 的结果与平台无关，三平台重复执行无信息量；只在 ubuntu 跑，
      # macos/windows 显示 skipped（Issue #172）。不拆独立 job：那要动分支保护的
      # required checks，且新增 job 的 checkout/install 开销把几秒收益吃回去。
      - name: Check source contracts and formatting
        if: env.RUN_VERIFY == 'true' && runner.os == 'Linux'
        run: pnpm run check

      - name: Typecheck (TS7)
        if: env.RUN_VERIFY == 'true' && runner.os == 'Linux'
        run: pnpm run typecheck

      - name: Test unit, integration, process, lease, and recovery behavior (Node.js)
        if: env.RUN_VERIFY == 'true'
        run: pnpm run test

      # Issue #386：Windows 上偶发全绿后空转到 timeout-minutes 上限，job 超时清理时报出的孤儿
      # 只有 pid/image name（如 "node"），认不出是哪条命令行。这一步紧跟在 Test 之后、用
      # if: always() 而不是等 job 超时，抢在 runner 最终 orphan 清理之前把当时还活着的 node.exe
      # 连 ParentProcessId 和 CommandLine 一起打出来，复现时才能直接点名，不必再靠推断。
      - name: Snapshot Windows node processes (diagnostic for #386)
        if: always() && env.RUN_VERIFY == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-CimInstance Win32_Process |
            Where-Object { $_.Name -eq 'node.exe' } |
            Select-Object ProcessId, ParentProcessId, CommandLine |
            Format-List

      - name: Build
        if: env.RUN_VERIFY == 'true'
        run: pnpm run build

      - name: Real CLI, process, Worker, signal, and Node.js artifact smoke
        if: env.RUN_VERIFY == 'true'
        run: pnpm --dir e2e run test:e2e:evidence

      - name: Upload CLI process failure evidence
        if: failure() && env.RUN_VERIFY == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: cli-process-evidence-${{ runner.os }}
          path: e2e/e2e-junit.xml
          if-no-files-found: warn

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: "11.20.0"

      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: pnpm

      - uses: microsoft/apm-action@v1
        with:
          apm-version: "0.27.0"
          setup-only: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint PR commits
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
