name: ci

on:
  push:
    branches: [main]
  pull_request:

# 分支保护是 strict: true，main 每前进一次所有未合分支都要 rebase 重推，旧 run 不取消就会同时
# 挂着好几轮抢 windows 名额。只对 PR 取消：push 到 main 的 run 是该 commit 唯一的验证记录，
# 取消它会让某个 main commit 永久失去证据（Issue #75）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 纯 .md 变更跳过三平台 verify（Issue #43）。verify 是 required check，
  # 不能用 workflow 级 paths-ignore：被过滤掉的 workflow 不上报 check，
  # required 状态会永远 pending 卡住合并；job 级 if 跳过则以 skipped 结论
  # 上报，分支保护视同通过。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7

      # predicate-quantifier: every 使 "**" + "!**/*.md" 表示
      # 「存在至少一个非 Markdown 的变更文件」；push 到 main 时以
      # default branch 为 base 比对（action 默认行为）。
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - "**"
              - "!**/*.md"

  verify:
    needs: changes
    # fail-safe：changes 自身失败时 verify 照常执行，探测故障不得放行（Issue #43）。
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # 正常一轮 3 分钟（ubuntu ~55s / macos ~55s / windows 2m30s–3m10s，check/typecheck 仅 ubuntu
    # 执行后 macos/windows 各省 3–15s，Issue #172）；冷缓存留足余量后仍远小于 GitHub 默认的
    # 6 小时。挂死的测试必须快速失败，而不是把 runner 占一上午（Issue #75）。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: microsoft/apm-action@v1
        if: runner.os != 'Windows'
        with:
          apm-version: "0.26.0"
          setup-only: true

      - name: Install APM on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "apm-windows-x86_64.zip"
          $destination = Join-Path $env:RUNNER_TEMP "apm-0.26.0"
          Invoke-WebRequest -Uri "https://github.com/microsoft/apm/releases/download/v0.26.0/apm-windows-x86_64.zip" -OutFile $archive
          $expectedHash = "1b74a90c7ee6373ab2926addd110c1dbc5934a9675e5f436cac4d04f46cce2f5"
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "APM archive hash mismatch: $actualHash"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $executable = Get-ChildItem -LiteralPath $destination -Filter "apm.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $executable) {
            throw "APM archive did not contain apm.exe"
          }
          Split-Path -Parent $executable | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $executable --version

      - name: Verify exact toolchain versions
        run: bun -e "if (Bun.version !== '1.3.14') process.exit(1)"

      # Windows 上未缓存的 bun install 要 31s，是 ubuntu 的 6 倍（Issue #40）。
      - name: Cache Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Turbo 默认写 <repo-root>/.turbo/cache。key 取 SHA 使每次提交独立成条，
      # restore-keys 让未改动 package 的 build/typecheck/test 命中上一条（Issue #40）。
      - name: Cache Turbo task cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-

      # Biome 与 tsgo 的结果与平台无关，三平台重复执行无信息量；只在 ubuntu 跑，
      # macos/windows 显示 skipped（Issue #172）。不拆独立 job：那要动分支保护的
      # required checks，且新增 job 的 checkout/install 开销把几秒收益吃回去。
      - name: Check source contracts and formatting
        if: runner.os == 'Linux'
        run: bun run check

      - name: Typecheck (TS7)
        if: runner.os == 'Linux'
        run: bun run typecheck

      - name: Test unit, integration, process, lease, and recovery behavior (Bun)
        run: bun run test

      - name: Build
        run: bun run build

      - name: Real CLI, process, Worker, signal, and Bun artifact smoke
        run: bun run --cwd e2e test:e2e:evidence

      - name: Upload CLI process failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cli-process-evidence-${{ runner.os }}
          path: e2e/e2e-junit.xml
          if-no-files-found: warn

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: microsoft/apm-action@v1
        with:
          apm-version: "0.26.0"
          setup-only: true

      - name: Cache Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint PR commits
        run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
