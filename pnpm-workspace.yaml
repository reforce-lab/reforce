packages:
  - e2e
  - "packages/*/*"
  - "tooling/*"
  - "sites/*"

allowBuilds:
  '@swc/core': true
  esbuild: true
  lefthook: true

catalog:
  "@biomejs/biome": ^2.5.6
  "@rslib/core": ^0.23.2
  "@swc/helpers": ^0.5.23
  "@types/node": ^26.1.2
  type-fest: ^5.8.0
  typescript: ^7.0.2
  vitest: ^4.1.10

# tsgo checker 接入（RFC 0012 S1，#273）钉死 nightly：`next` tag 日更会漂，dev 版才有
# Type/Signature 服务端 memoization 与不可空签名。7.1 GA 时本条目改回正式版即可，
# 消费方只有 compiler 的 typescript/unstable/* 单点 import。
catalogs:
  ts-next:
    typescript: 7.1.0-dev.20260806.1

minimumReleaseAgeExclude:
  - '@biomejs/biome@2.5.7'
  - '@biomejs/cli-darwin-arm64@2.5.7'
  - '@biomejs/cli-darwin-x64@2.5.7'
  - '@biomejs/cli-linux-arm64-musl@2.5.7'
  - '@biomejs/cli-linux-arm64@2.5.7'
  - '@biomejs/cli-linux-x64-musl@2.5.7'
  - '@biomejs/cli-linux-x64@2.5.7'
  - '@biomejs/cli-win32-arm64@2.5.7'
  - '@biomejs/cli-win32-x64@2.5.7'
  - fumapress@1.0.0-beta.2

# pnpm 11 起 patchedDependencies 只认本文件（package.json 内的同名字段被静默忽略，
# 上游 pnpm/pnpm#11536）。patch 内容与 bun 时代相同：get-tsconfig 的 UNC 补偿移除（Issue #85）。
patchedDependencies:
  get-tsconfig@4.14.1: patches/get-tsconfig@4.14.1.patch
